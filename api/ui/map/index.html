<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Indus World — Site Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

  #map { height: 100vh; }
  .info { background: white; padding: 8px 12px; border-radius: 6px; }
  .info h3 { margin: 0 0 6px; font-size: 14px; }
  .info p { margin: 2px 0; font-size: 12px; color: #444; }
  .legend { background: white; padding: 8px 12px; border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const MOUNDS = {"type": "FeatureCollection", "properties": {"crs": "WGS-84", "generated_by": "ingest/georef.py build_areas()", "anchor": {"label": "Harappa Museum (OSM building)", "lat": 30.6247339, "lon": 72.8646927}, "scale_m_per_px": 1.2595041322314051, "rotation_deg_east_of_up": 2.96, "validation": "village core within 155 m of OSM node; residual consistent with post-1940 eastward growth"}, "features": [{"type": "Feature", "properties": {"place_id": "harappa:area:AB", "level": "area", "parent_id": "harappa", "label": "Mound AB", "note": "North-south ridge south of F, excavation sections I-IV. 49 seals.", "centroid": [72.86281189600503, 30.629669764082948], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 49}, "geometry": {"type": "Polygon", "coordinates": [[[72.86175448181237, 30.631525976875057], [72.86312398096568, 30.631728933367658], [72.8640847266928, 30.63106403543437], [72.86430066356752, 30.629374634829176], [72.86381078632519, 30.627936786387252], [72.86292587294352, 30.627330774846094], [72.86208838011335, 30.627859605976287], [72.86164278907705, 30.62953871586002], [72.86157538254776, 30.630668413170632], [72.86175448181237, 30.631525976875057]]]}}, {"type": "Feature", "properties": {"place_id": "harappa:area:B", "level": "area", "parent_id": "harappa", "label": "Mound B", "note": "Small mound north of E, near modern grave yards. 16 seals. Approximate box.", "centroid": [72.86220978280573, 30.631227801877223], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 16}, "geometry": {"type": "Polygon", "coordinates": [[[72.8619466309578, 30.6313929972884], [72.86240593928095, 30.631413578731323], [72.86247293465367, 30.63106260646605], [72.86201362633051, 30.631042025023124], [72.8619466309578, 30.6313929972884]]]}}, {"type": "Feature", "properties": {"place_id": "harappa:area:C", "level": "area", "parent_id": "harappa", "label": "Area C", "note": "Small area north of mound E. 1 seal. Approximate box.", "centroid": [72.8644749331892, 30.631470892183525], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 1}, "geometry": {"type": "Polygon", "coordinates": [[[72.86421178134125, 30.6316360875947], [72.86467108966441, 30.631656669037625], [72.86473808503713, 30.631305696772348], [72.86427877671397, 30.631285115329426], [72.86421178134125, 30.6316360875947]]]}}, {"type": "Feature", "properties": {"place_id": "harappa:area:D", "level": "area", "parent_id": "harappa", "label": "Area D", "note": "Small excavation area at the south foot of Mound AB. 20 seals. Polygon is a small approximate box around the 'D' label.", "centroid": [72.86406245546505, 30.627771076440002], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 20}, "geometry": {"type": "Polygon", "coordinates": [[[72.86381078632519, 30.627936786387252], [72.86427009464835, 30.627957367830174], [72.86433709002105, 30.6276063955649], [72.86383185086558, 30.627583755977685], [72.86381078632519, 30.627936786387252]]]}}, {"type": "Feature", "properties": {"place_id": "harappa:area:E", "level": "area", "parent_id": "harappa", "label": "Mound E", "note": "Large east-west mound east of AB. No seals in the Vats tabulation carry mound=E; included for completeness.", "centroid": [72.86713773413953, 30.62741331456], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 0}, "geometry": {"type": "Polygon", "coordinates": [[[72.8644828971776, 30.62825008287929], [72.86629906592982, 30.62868 Cemetery R 37 area between AB and E. 4 seals. Approximate box.", "centroid": [72.86453080633922, 30.626482358151087], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 4}, "geometry": {"type": "Polygon", "coordinates": [[[72.86400144575143, 30.626671022273538], [72.86492006239773, 30.626712185159388], [72.86506016692701, 30.626293694028636], [72.86414155028069, 30.62625253114279], [72.86400144575143, 30.626671022273538]]]}}, {"type": "Feature", "properties": {"place_id": "harappa:area:J", "level": "area", "parent_id": "harappa", "label": "Area J", "note": "Small excavation area south of AB, east of D. 4 seals. Approximate box.", "centroid": [72.86454472920435, 30.627792686955072], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 4}, "geometry": {"type": "Polygon", "coordinates": [[[72.86431602548066, 30.627959425974467], [72.86472940297149, 30.6279779492731], [72.86479639834421, 30.627626977007825], [72.86433709002105, 30.6276063955649], [72.86431602548066, 30.627959425974467]]]}}, {"type": "Feature", "properties": {"place_id": "harappa:area:P", "level": "area", "parent_id": "harappa", "label": "Great Granary area (Mound F)", "note": "Vats' 'Mound P' = the Great Granary excavation complex (trenches I-VI); confirmed by 'Mound P, Great Granary Area, Square J 9/20' (Vol I). 82 seals. Polygon covers the hatched excavation blocks on Pl. I; it lies inside F's footprint.", "centroid": [72.86117368441583, 30.632255096732056], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "1000-ft grid scale + north-arrow rotation + OSM museum anchor", "uncertainty_m": 250, "seal_count": 82}, "geometry": {"type": "Polygon", "coordinates": [[[72.859952030347, 30.632790312020447], [72.86144056948919, 30.632927807791866], [72.86226963650319, 30.6325401888255], [72.8621969385032, 30.631828982645636], [72.86106130641956, 30.631565710792586], [72.86012162523284, 30.631877578316303], [72.859952030347, 30.632790312020447]]]}}, {"type": "Feature", "properties": {"place_id": "harappa", "level": "site", "parent_id": null, "label": "Harappa", "note": "Archaeological site; fallback for records with no mapped area", "centroid": [72.86444, 30.62919], "source": "Vats 1940, Pl. I (1999 ASI reprint scan)", "georef_method": "mean of area centroids", "uncertainty_m": 1500}, "geometry": null}]};
const SITES = {"features": [{"geometry": {"coordinates": [72.8739, 30.6357], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Harappa", "notes": "Type site. Detailed mound gazetteer in mound_areas.geojson.", "periods": ["early", "mature", "late"], "site_id": "harappa", "size_class": "major_city", "sources": ["Vats 1940"], "uncertainty_m": 500}, "type": "Feature"}, {"geometry": {"coordinates": [67.1386, 27.3292], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Mohenjo-daro", "notes": "Largest known Indus city. Seal tabulation parser pending.", "periods": ["mature", "late"], "site_id": "mohenjo-daro", "size_class": "major_city", "sources": ["Marshall 1931"], "uncertainty_m": 500}, "type": "Feature"}, {"geometry": {"coordinates": [76.1146, 29.3901], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Rakhigarhi", "notes": "Possibly the largest Indus site by area; excavations ongoing.", "periods": ["early", "mature", "late"], "site_id": "rakhigarhi", "size_class": "major_city", "sources": ["ASI reports"], "uncertainty_m": 1000}, "type": "Feature"}, {"geometry": {"coordinates": [74.13, 29.4619], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Kalibangan", "notes": "Ghaggar-Hakra (Saraswati) belt; pre-Harappan and Harappan phases.", "periods": ["early", "mature"], "site_id": "kalibangan", "size_class": "major_city", "sources": ["Lal & Thapar"], "uncertainty_m": 500}, "type": "Feature"}, {"geometry": {"coordinates": [70.2137, 23.8862], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Dholavira", "notes": "Kachchh; famous water management systems and signboard inscription.", "periods": ["early", "mature", "late"], "site_id": "dholavira", "size_class": "major_city", "sources": ["Bisht, ASI"], "uncertainty_m": 500}, "type": "Feature"}, {"geometry": {"coordinates": [72.2498, 22.5259], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Lothal", "notes": "Port town with dockyard; bead-making center.", "periods": ["mature", "late"], "site_id": "lothal", "size_class": "town", "sources": ["Rao, ASI"], "uncertainty_m": 500}, "type": "Feature"}, {"geometry": {"coordinates": [62.03, 38.19], "type": "Point"}, "properties": {"affiliation": "related", "excavation_status": "excavated", "harappan_connection": "Indus seals, ivory objects, and carnelian beads excavated; BMAC-Harappan trade contact (Sarianidi).", "name": "Gonur Tepe", "notes": "BMAC (Oxus civilization) capital in Margiana, Turkmenistan. Key evidence for Indus-Central Asia contact.", "periods": ["mature"], "site_id": "gonur-tepe", "size_class": "major_city", "sources": ["Sarianidi"], "uncertainty_m": 2000}, "type": "Feature"}, {"geometry": {"coordinates": [46.1031, 30.9625], "type": "Point"}, "properties": {"affiliation": "related", "excavation_status": "excavated", "harappan_connection": "Indus seals and sealings found in Mesopotamian context; Meluhha trade (Woolley excavations).", "name": "Ur", "notes": "Sumerian city; Indus (Meluhha) merchant presence attested.", "periods": ["mature"], "site_id": "ur", "size_class": "major_city", "sources": ["Woolley"], "uncertainty_m": 1000}, "type": "Feature"}, {"geometry": {"coordinates": [50.55, 26.03], "type": "Point"}, "properties": {"affiliation": "related", "excavation_status": "excavated", "harappan_connection": "Entrepot for Indus-Mesopotamia Gulf trade; Indus-related weights and seals.", "name": "Dilmun (Bahrain)", "notes": "Persian Gulf trade hub linking Meluhha (Indus) and Mesopotamia.", "periods": ["mature"], "site_id": "dilmun-bahrain", "size_class": "town", "sources": ["Bibby; Hojlund"], "uncertainty_m": 5000}, "type": "Feature"}, {"geometry": {"coordinates": [69.53, 37.33], "type": "Point"}, "properties": {"affiliation": "harappan", "excavation_status": "excavated", "harappan_connection": null, "name": "Shortugai", "notes": "Northernmost Harappan outpost (Afghanistan); lapis lazuli trade.", "periods": ["mature"], "site_id": "shortugai", "size_class": "town", "sources": ["Francfort"], "uncertainty_m": 2000}, "type": "Feature"}], "metadata": {"coordinate_note": "Representative site centers; uncertainty_m reflects location pinning quality.", "description": "Site-level places: Harappan settlements and related sites with documented Harappan contacts.", "sources": "See ingest/SITES_GAZETTEER.md", "title": "Indus World Site Gazetteer"}, "type": "FeatureCollection"};

const map = L.map('map').setView([28.5, 62.0], 5);

const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Esri World Imagery'
});
osm.addTo(map);

// --- site markers ---
const siteLayer = L.geoJSON(SITES, {
  pointToLayer: (f, latlng) => {
    const harappan = f.properties.affiliation === 'harappan';
    const major = f.properties.size_class === 'major_city';
    return L.circleMarker(latlng, {
      radius: major ? 9 : 6,
      color: harappan ? '#1a5fb4' : '#813d9c', weight: 2,
      fillColor: harappan ? '#1a5fb4' : '#813d9c', fillOpacity: 0.7
    });
  },
  onEachFeature: (f, l) => {
    const p = f.properties;
    let h = '<div class="info"><h3>' + p.name + '</h3>' +
      '<p><b>Affiliation:</b> ' + p.affiliation + '</p>' +
      '<p><b>Size:</b> ' + p.size_class + ' | <b>Status:</b> ' + p.excavation_status + '</p>' +
      '<p><b>Periods:</b> ' + (p.periods||[]).join(', ') + '</p>';
    if (p.harappan_connection) h += '<p><b>Harappan connection:</b> ' + p.harappan_connection + '</p>';
    if (p.notes) h += '<p>' + p.notes + '</p>';
    h += '</div>';
    l.bindPopup(h);
    l.bindTooltip(p.name);
  }
});

// --- Harappa mound polygons ---
const COLORS = {
  'harappa:area:F': '#e41a1c', 'harappa:area:P': '#ff7f00',
  'harappa:area:AB': '#4daf4a', 'harappa:area:E': '#984ea3',
  'harappa:area:D': '#377eb8', 'harappa:area:J': '#f781bf',
  'harappa:area:H': '#a65628', 'harappa:area:G': '#999999',
  'harappa:area:B': '#ffff33', 'harappa:area:C': '#66c2a5'
};
const moundLayer = L.geoJSON(MOUNDS, {
  filter: f => f.properties.level === 'area' && f.geometry,
  style: f => {
    const c = COLORS[f.properties.place_id] || '#3388ff';
    return {color: c, weight: 2.5, fillColor: c, fillOpacity: 0.18};
  },
  onEachFeature: (f, l) => {
    const p = f.properties;
    l.bindPopup('<div class="info"><h3>' + p.label + '</h3>' +
      '<p><b>ID:</b> <code>' + p.place_id + '</code></p>' +
      '<p><b>Seals:</b> ' + (p.seal_count || 0) + ' | <b>Uncertainty:</b> &plusmn;' + p.uncertainty_m + ' m</p>' +
      (p.note ? '<p>' + p.note + '</p>' : '') + '</div>');
  }
});

// --- Plate I overlay ---
const plateOverlay = L.imageOverlay('plate-i.jpg',
  [[30.62183, 72.85297], [30.63698, 72.87678]], {opacity: 0.65});

// --- zoom-dependent visibility ---
function updateLayers() {
  const z = map.getZoom();
  if (z < 10) {
    if (!map.hasLayer(siteLayer)) map.addLayer(siteLayer);
    if (map.hasLayer(moundLayer)) map.removeLayer(moundLayer);
    if (map.hasLayer(plateOverlay)) map.removeLayer(plateOverlay);
  } else {
    if (map.hasLayer(siteLayer)) map.removeLayer(siteLayer);
    if (!map.hasLayer(moundLayer)) map.addLayer(moundLayer);
  }
}
map.on('zoomend', updateLayers);
updateLayers();

L.control.layers(
  {"OpenStreetMap": osm, "Satellite": sat},
  {"Sites": siteLayer, "Harappa mounds": moundLayer, "Plate I overlay": plateOverlay},
  {collapsed: false}
).addTo(map);

const legend = L.control({position: 'bottomright'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = '<b>Sites</b><br>' +
    '<span style="color:#1a5fb4">&#9679;</span> Harappan settlement<br>' +
    '<span style="color:#813d9c">&#9679;</span> Related site (Harappan contact)<br>' +
    '<span style="font-size:10px">Zoom in for mound detail</span>';
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
