      1954.'
    kind: normalized
    state: verified
    evidence:
    - source: unesco-whc
      locator: WH list ref 1192ter description
  harappan_connection:
    value: At Qal'at al-Bahrain, the first Indus-inspired circular 'Gulf-type' stamp seals appear in layers
      contemporary with the city-wall construction c. 2050 BCE, some bearing short inscriptions in Indus
      script; simultaneously a formal weight system was adopted - cubical and spherical stone weights
      matching Harappan standard units, the system known in Babylonia as the 'Tilmun norm' (na Tilmun,
      UET 5 796). Square polished weights of Indus origin are also reported from the site.
    kind: normalized
    state: verified
    evidence:
    - source: laursen-steinkeller2017
      locator: 'p. 50: Gulf-type seals c. 2050 BCE; Harappan-standard weights; Tilmun norm (UET 5 796)'
    - source: crawford2001
      locator: '''items like the square polished weights which also originate in the Indus Valley (Hojlund
        & Andersen 1994, p. 118)'''
    note: Laursen & Steinkeller p. 50 via published excerpt of the volume; a direct page-check against
      a copy would strengthen this. Crawford is appropriately cautious that Gulf seals may reflect a local
      tradition adapting foreign traits.
