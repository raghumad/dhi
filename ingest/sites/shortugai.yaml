  notes:
    value: Northernmost Indus site, in northeast Afghanistan on the Oxus (Amu Darya); a trading colony
      of the Indus cities, established to obtain lapis lazuli (Badakshan), gold, copper, and tin from
      Central Asia. Discovered 1975; excavated 1976-79 under Henri-Paul Francfort (French mission); fully
      published 1989.
    kind: normalized
    state: verified
    evidence:
    - source: ignou-unit5
      locator: 'Section 5.3: ''The northern most site of the Indus civilization is Shortughai in northeast
        Afghanistan... access could be gained to lapis lazuli of Badakshan, and to tin and gold resources
        of Central Asia'''
    - source: kenoyer1998
      locator: 'p. 96: established ''to obtain gold, copper, tin and lapis lazuli, as well as other exotic
        goods from Central Asia'''
    - source: pleiades-shortughai
      locator: '''An ancient trading colony on the Oxus river in the vicinity of the lapis lazuli mines
        of northern Afghanistan dating to ca. 2000 BC'''
