  notes:
    value: One of the largest cities of the Harappan Civilization (Hisar district, Haryana); seven mounds
      over ~300 ha. ASI 1997-2000 fieldwork found planned mud/burnt-brick townships, drainage, fortification,
      and a bead-manufacturing industry. No decline-phase evidence.
