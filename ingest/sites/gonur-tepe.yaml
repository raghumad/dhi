  harappan_connection:
    value: A square Indus stamp seal with an elephant and an eight-sign Indus inscription was excavated
      at Gonur by V.I. Sarianidi in 2004 (Sarianidi 2005, fig. 114); its sign sequences are paralleled
      in the Indus valley (Parpola 2006, via Kaniuth & Shaydullaev 2022). Elephant-ivory working at Gonur
      independently attests Indus contact (Frenez 2018).
    kind: normalized
    state: verified
    evidence:
    - source: kaniuth-shaydullaev2022
      locator: Indus seal excavated by Sarianidi 2004; elephant + eight-sign inscription paralleled in
        the Indus valley (Parpola 2006)
    - source: parpola2018
      locator: '''In 2004, a square Indus seal with elephant and a line of Indus script with native Harappan
        sequences was excavated at Gonur in Turkmenistan'''
    - source: frenez2018
      locator: elephant-ivory working at Gonur Depe
    note: Full bibliographic title of 'Sarianidi 2005' not verified in this pass; Temple of Water/Area
      9/Room 19 findspot via secondary citation.
