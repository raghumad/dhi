  harappan_connection:
    value: 'Sixteen Indus-style seals excavated at Ur: published by C.J. Gadd 1932 (''Seals of ancient
      Indian style found at Ur,'' Proc. British Academy XVIII); four from the Royal Cemetery (UE 2, Woolley
      1934); nine catalogued UE 10 (Legrain 1951, Cat. 624-632). UE 10''s Introductory Note states they
      ''prove the existence of early trade relations between the Indus valley and lower Mesopotamia.'''
    kind: normalized
    state: verified
    evidence:
    - source: gadd1932
      locator: '16 Indus-style seals at Ur (cited via UE 10''s own footnote: PBA vol. XVIII, 19 Oct 1932,
        22 pp., 3 pls.)'
    - source: legrain1951
      locator: Cat. 624-632; Introductory Note on Indus-Mesopotamia trade
    note: Gadd 1932 paper cited via UE 10's footnote (not read in full); individual seal U.7683/BM 120573
      claims left out (non-authoritative sources only).
